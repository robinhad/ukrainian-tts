# JETS smoke configuration derived from the pinned official ESPnet LJSpeech recipe.
tts: jets
tts_conf:
    generator_type: jets_generator
    generator_params:
        adim: 256
        aheads: 2
        elayers: 4
        eunits: 1024
        dlayers: 4
        dunits: 1024
        positionwise_layer_type: conv1d
        positionwise_conv_kernel_size: 3
        duration_predictor_layers: 2
        duration_predictor_chans: 256
        duration_predictor_kernel_size: 3
        use_masking: true
        encoder_normalize_before: true
        decoder_normalize_before: true
        encoder_type: transformer
        decoder_type: transformer
        conformer_rel_pos_type: latest
        conformer_pos_enc_layer_type: rel_pos
        conformer_self_attn_layer_type: rel_selfattn
        conformer_activation_type: swish
        use_macaron_style_in_conformer: true
        use_cnn_in_conformer: true
        conformer_enc_kernel_size: 7
        conformer_dec_kernel_size: 31
        init_type: xavier_uniform
        transformer_enc_dropout_rate: 0.2
        transformer_enc_positional_dropout_rate: 0.2
        transformer_enc_attn_dropout_rate: 0.2
        transformer_dec_dropout_rate: 0.2
        transformer_dec_positional_dropout_rate: 0.2
        transformer_dec_attn_dropout_rate: 0.2
        pitch_predictor_layers: 5
        pitch_predictor_chans: 256
        pitch_predictor_kernel_size: 5
        pitch_predictor_dropout: 0.5
        pitch_embed_kernel_size: 1
        pitch_embed_dropout: 0.0
        stop_gradient_from_pitch_predictor: true
        energy_predictor_layers: 2
        energy_predictor_chans: 256
        energy_predictor_kernel_size: 3
        energy_predictor_dropout: 0.5
        energy_embed_kernel_size: 1
        energy_embed_dropout: 0.0
        stop_gradient_from_energy_predictor: false
        generator_out_channels: 1
        generator_channels: 512
        generator_global_channels: -1
        generator_kernel_size: 7
        generator_upsample_scales: [8, 8, 2, 2]
        generator_upsample_kernel_sizes: [16, 16, 4, 4]
        generator_resblock_kernel_sizes: [3, 7, 11]
        generator_resblock_dilations: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
        generator_use_additional_convs: true
        generator_bias: true
        generator_nonlinear_activation: LeakyReLU
        generator_nonlinear_activation_params:
            negative_slope: 0.1
        generator_use_weight_norm: true
        segment_size: 32
    discriminator_type: hifigan_multi_scale_multi_period_discriminator
    discriminator_params:
        scales: 1
        scale_downsample_pooling: AvgPool1d
        scale_downsample_pooling_params:
            kernel_size: 4
            stride: 2
            padding: 2
        scale_discriminator_params:
            in_channels: 1
            out_channels: 1
            kernel_sizes: [15, 41, 5, 3]
            channels: 128
            max_downsample_channels: 1024
            max_groups: 16
            bias: true
            downsample_scales: [2, 2, 4, 4, 1]
            nonlinear_activation: LeakyReLU
            nonlinear_activation_params:
                negative_slope: 0.1
            use_weight_norm: true
            use_spectral_norm: false
        follow_official_norm: false
        periods: [2, 3, 5, 7, 11]
        period_discriminator_params:
            in_channels: 1
            out_channels: 1
            kernel_sizes: [5, 3]
            channels: 32
            downsample_scales: [3, 3, 3, 3, 1]
            max_downsample_channels: 1024
            bias: true
            nonlinear_activation: LeakyReLU
            nonlinear_activation_params:
                negative_slope: 0.1
            use_weight_norm: true
            use_spectral_norm: false
    generator_adv_loss_params:
        average_by_discriminators: false
        loss_type: mse
    discriminator_adv_loss_params:
        average_by_discriminators: false
        loss_type: mse
    feat_match_loss_params:
        average_by_discriminators: false
        average_by_layers: false
        include_final_outputs: true
    mel_loss_params:
        fs: 24000
        n_fft: 1024
        hop_length: 256
        win_length: null
        window: hann
        n_mels: 80
        fmin: 0
        fmax: null
        log_base: null
    lambda_adv: 1.0
    lambda_mel: 45.0
    lambda_feat_match: 2.0
    lambda_var: 1.0
    lambda_align: 1.0
    sampling_rate: 24000
    cache_generator_outputs: true
pitch_extract: dio
pitch_extract_conf:
    reduction_factor: 1
    use_token_averaged_f0: false
pitch_normalize: global_mvn
energy_extract: energy
energy_extract_conf:
    reduction_factor: 1
    use_token_averaged_energy: false
energy_normalize: global_mvn
optim: adamw
optim_conf:
    lr: 2.0e-4
    betas: [0.8, 0.99]
    eps: 1.0e-9
    weight_decay: 0.0
scheduler: exponentiallr
scheduler_conf:
    gamma: 0.999875
optim2: adamw
optim2_conf:
    lr: 2.0e-4
    betas: [0.8, 0.99]
    eps: 1.0e-9
    weight_decay: 0.0
scheduler2: exponentiallr
scheduler2_conf:
    gamma: 0.999875
generator_first: true
num_iters_per_epoch: 100
max_epoch: 10
accum_grad: 2
batch_bins: 1000000
batch_type: numel
grad_clip: -1
grad_noise: false
sort_in_batch: descending
sort_batch: descending
num_workers: 4
use_amp: false
log_interval: 10
keep_nbest_models: 5
num_att_plot: 3
seed: 777
patience: null
unused_parameters: true
best_model_criterion:
    - [valid, text2mel_loss, min]
    - [train, text2mel_loss, min]
    - [train, total_count, max]
cudnn_deterministic: false
cudnn_benchmark: false
